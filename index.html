<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melaka Experience Bingo - Live Edition</title>
  
  <!-- Firebase Compat Libraries (Easy Setup for HTML files) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f5f0eb; margin: 0; padding: 16px; color: #333; }
    h1 { text-align: center; color: #8b0000; margin-bottom: 5px; font-size: 24px; text-transform: uppercase; }
    p.subtitle { text-align: center; color: #666; font-size: 14px; margin-top: 0; margin-bottom: 20px; }
    
    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 600px;
      margin: 0 auto;
    }

    .bingo-card {
      background: white;
      border: 2px solid #ddd;
      border-radius: 12px;
      aspect-ratio: 1;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      position: relative;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s, border-color 0.2s;
      overflow: hidden;
    }

    .bingo-card.completed { padding: 0; border: 3px solid #2e7d32; }
    .bingo-card h3 { font-size: 11px; margin: 6px 0 0 0; font-weight: 600; line-height: 1.2; z-index: 2; }
    .type-tag { font-size: 9px; text-transform: uppercase; background: #eee; padding: 2px 5px; border-radius: 4px; color: #555; z-index: 2; }
    
    .photo-thumb-full {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0; left: 0;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal {
      background: white;
      border-radius: 16px;
      padding: 20px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }

    .modal h2 { margin-top: 0; color: #8b0000; }
    .modal p { color: #555; font-size: 16px; line-height: 1.4; }
    
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #8b0000;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      text-decoration: none;
    }
    .btn-secondary { background: #555; }
    .btn-gps { background: #1976d2; }
    input[type="file"] { display: none; }

    /* Admin Panel */
    .admin-trigger { text-align: center; margin-top: 40px; }
    .admin-trigger button { background: transparent; border: none; color: #aaa; cursor: pointer; text-decoration: underline; }
    
    .admin-panel {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: #e0e0e0;
      border-radius: 8px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
    .admin-links { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .admin-links a { background: white; padding: 10px; border-radius: 4px; font-size: 12px; word-break: break-all; color: #1976d2; text-decoration: none; border: 1px solid #ccc; }
  </style>
</head>
<body>

  <h1 id="team-title">MELAKA BINGO</h1>
  <p class="subtitle" id="sync-status">Connecting to Live Server...</p>

  <div class="bingo-grid" id="grid"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <span class="type-tag" id="modal-type">Type</span>
      <h2 id="modal-title">Item Name</h2>
      <p id="modal-hint">Hint details...</p>
      
      <a id="modal-gps" class="btn btn-gps" target="_blank">📍 Open in Google Maps</a>
      
      <button class="btn" id="photo-btn" onclick="triggerCamera()">📸 Take Photo to Complete</button>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handlePhoto(event)">

      <button class="btn btn-secondary" onclick="closeModal()">Close</button>
    </div>
  </div>

  <!-- Admin Login & Panel -->
  <div class="admin-trigger">
    <button onclick="promptAdmin()">Admin Access</button>
  </div>
  <div class="admin-panel" id="admin-panel">
    <h3>Admin: Generate Team Links</h3>
    <button class="btn btn-secondary" onclick="generateTeamLinks()">Generate Shuffled Links</button>
    <div class="admin-links" id="admin-links-container"></div>
  </div>

  <script>
    // =========================================================================
    // ⚠️ PASTE YOUR FIREBASE CONFIG HERE ⚠️
    // Replace the details inside this bracket with the code Firebase gave you
    // =========================================================================
const firebaseConfig = {
  apiKey: "AIzaSyCMMoK-OyrpH3Byu_fthdK7MivGkgcIKVQ",
  authDomain: "melaka-bingo.firebaseapp.com",
  projectId: "melaka-bingo",
  storageBucket: "melaka-bingo.firebasestorage.app",
  messagingSenderId: "664309737467",
  appId: "1:664309737467:web:c99c34ba0dd9eff7f64d5e",
  measurementId: "G-NQWV2D1K7G"
};

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const baseItems = [
      { id: 1, name: "Klebang Coconut Shake", type: "Food", hint: "Look for the long queue near Klebang Beach! Cool, refreshing blend topped with vanilla ice cream.", lat: 2.2173, lng: 102.2023 },
      { id: 2, name: "Stadthuys", type: "Sight", hint: "The iconic bright terracotta-red building built by the Dutch in 1650 in Red Square.", lat: 2.1942, lng: 102.2486 },
      { id: 3, name: "Nyonya Laksa", type: "Food", hint: "Rich coconut curry noodle soup topped with fresh prawns, fish cakes, and hard-boiled egg.", lat: 2.1970, lng: 102.2450 },
      { id: 4, name: "Jonker Walk", type: "Shop/Sight", hint: "Vibrant night market street packed with souvenirs, street food, and historic shophouses.", lat: 2.1963, lng: 102.2460 },
      { id: 5, name: "Asam Pedas Fish", type: "Food", hint: "Tangy, spicy fish stew cooked with fresh tamarind, chili, and ladyfingers (okra).", lat: 2.1920, lng: 102.2500 },
      { id: 6, name: "Christ Church", type: "Sight", hint: "An 18th-century Anglican church built with red bricks shipped directly from Holland.", lat: 2.1940, lng: 102.2488 },
      { id: 7, name: "A Famosa", type: "Sight", hint: "Porta de Santiago - among the oldest European architectural remains in all of Asia.", lat: 2.1917, lng: 102.2503 },
      { id: 8, name: "Satay Celup", type: "Food", hint: "Dip raw food skewers directly into a boiling pot of aromatic, rich peanut sauce.", lat: 2.2000, lng: 102.2510 },
      { id: 9, name: "Chicken Rice Balls", type: "Food", hint: "Hainan chicken served with rice rolled into savory, compact bite-sized balls.", lat: 2.1955, lng: 102.2472 },
      { id: 10, name: "Baba Nyonya Museum", type: "Sight", hint: "A preserved 19th-century Peranakan townhouse showcasing Straits Chinese heritage.", lat: 2.1958, lng: 102.2455 },
      { id: 11, name: "Melaka River Cruise", type: "Sight", hint: "Board a river boat at Muara Jetty to see murals, heritage bridges, and street art.", lat: 2.1935, lng: 102.2480 },
      { id: 12, name: "Kuih Pie Tee", type: "Food", hint: "Crispy pastry tart shells filled with savory shredded turnip, prawns, and sweet chili sauce.", lat: 2.1960, lng: 102.2465 },
      { id: 13, name: "Dataran Pahlawan", type: "Shop", hint: "A modern multi-storey shopping mall right in the heart of Melaka's historic district.", lat: 2.1898, lng: 102.2515 },
      { id: 14, name: "Maritime Museum", type: "Sight", hint: "A full-size replica of the historic Portuguese ship 'Flora de la Mar' standing 34m tall.", lat: 2.1910, lng: 102.2461 },
      { id: 15, name: "St. Paul's Hill", type: "Sight", hint: "Climb the stairs from A Famosa to visit church ruins overlooking the Melaka Straits.", lat: 2.1925, lng: 102.2494 },
      { id: 16, name: "Gula Melaka Cendol", type: "Food", hint: "Shaved ice loaded with pandan jelly, coconut milk, and dark smoky palm sugar syrup.", lat: 2.1962, lng: 102.2470 }
    ];

    let activeItems = [];
    let activeItemId = null;
    let completedItems = {};
    let teamName = "lobby";

    function initializeApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const layout = urlParams.get('layout');
      const team = urlParams.get('team');
      
      if (team) {
        teamName = `team_${team}`;
        document.getElementById('team-title').innerText = `TEAM ${team} BINGO`;
      } else {
        document.getElementById('team-title').innerText = `LOBBY BINGO`;
      }

      if (layout) {
        const order = layout.split(',').map(Number);
        activeItems = order.map(id => baseItems.find(item => item.id === id));
      } else {
        activeItems = [...baseItems];
      }

      // Live Sync: Listen to Firebase for updates
      const teamRef = db.ref('bingo_progress/' + teamName);
      teamRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          completedItems = data;
        }
        document.getElementById('sync-status').innerText = "🟢 Live Sync Active";
        document.getElementById('sync-status').style.color = "#2e7d32";
        renderGrid();
      }, (error) => {
        document.getElementById('sync-status').innerText = "🔴 Database Error (Check Rules)";
        document.getElementById('sync-status').style.color = "red";
      });
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      activeItems.forEach(item => {
        const isCompleted = !!completedItems[item.id];
        const card = document.createElement('div');
        card.className = `bingo-card ${isCompleted ? 'completed' : ''}`;
        card.onclick = () => openModal(item, isCompleted);

        if (isCompleted) {
          card.innerHTML = `<img src="${completedItems[item.id]}" class="photo-thumb-full"/>`;
        } else {
          card.innerHTML = `<span class="type-tag">${item.type}</span><h3>${item.name}</h3>`;
        }
        grid.appendChild(card);
      });
    }

    function openModal(item, isCompleted) {
      activeItemId = item.id;
      document.getElementById('modal-title').innerText = item.name;
      document.getElementById('modal-type').innerText = item.type;
      
      if (isCompleted) {
        document.getElementById('modal-hint').innerHTML = `<strong>Completed!</strong><br><br>"${item.type}" ${item.name}`;
        document.getElementById('photo-btn').innerText = "📸 Retake Photo";
      } else {
        document.getElementById('modal-hint').innerHTML = `<strong>💡 Hint:</strong> ${item.hint}`;
        document.getElementById('photo-btn').innerText = "📸 Take Photo to Complete";
      }

      document.getElementById('modal-gps').href = `https://www.google.com/maps/search/?api=1&query=${item.lat},${item.lng}`;
      document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function triggerCamera() { document.getElementById('cameraInput').click(); }

    function handlePhoto(event) {
      const file = event.target.files[0];
      if (!file || !activeItemId) return;

      document.getElementById('photo-btn').innerText = "⏳ Uploading...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 500;
          const scaleSize = MAX_WIDTH / img.width;
          canvas.width = MAX_WIDTH;
          canvas.height = img.height * scaleSize;
          
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          
          // Compress and upload to Firebase
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
          db.ref('bingo_progress/' + teamName + '/' + activeItemId).set(compressedDataUrl)
            .then(() => closeModal())
            .catch(err => alert("Upload failed: " + err.message));
        }
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function promptAdmin() {
      const pw = prompt("Enter Admin Password:");
      if (pw === "Admin123") {
        document.getElementById('admin-panel').style.display = "block";
      } else if (pw !== null) {
        alert("Incorrect password.");
      }
    }

    function generateTeamLinks() {
      const container = document.getElementById('admin-links-container');
      container.innerHTML = '';
      const baseUrl = window.location.href.split('?')[0];

      for (let i = 1; i <= 10; i++) {
        let ids = baseItems.map(item => item.id);
        for (let j = ids.length - 1; j > 0; j--) {
          const k = Math.floor(Math.random() * (j + 1));
          [ids[j], ids[k]] = [ids[k], ids[j]];
        }
        const teamUrl = `${baseUrl}?team=${i}&layout=${ids.join(',')}`;
        container.innerHTML += `<a href="${teamUrl}" target="_blank"><strong>Team ${i}:</strong><br>${teamUrl}</a>`;
      }
    }

    window.onload = initializeApp;
  </script>
</body>
</html>
